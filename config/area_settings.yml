# config/area_settings.yml
contact_areas:
  # CAFM/STM tip 類型
  stm_sharp_tip: 1e-14      # ~10 nm radius
  stm_blunt_tip: 1e-12      # ~100 nm radius  
  cafm_typical: 1e-10       # ~1 µm contact
  
  # 材料特定 (您目前主要用這些)
  MoS2_flake: 1e-12         # 單/少層 MoS2 典型值
  MoS2_bulk: 1e-9           # 多層/體材
  graphene_flake: 1e-11
  
  # 自定義 (實驗中可臨時覆蓋)
  custom: null              # 使用時再傳入

# 便捷查詢表 (可選)
tip_radius_lookup:
  10nm: 1e-14
  50nm: 2.5e-13
  100nm: 1e-12